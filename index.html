function configPage(){
  const cfg=gCfg();
  return`<div class="pg-hdr"><div><div class="pg-title">Configurações</div></div></div>
  <div style="max-width:540px;display:flex;flex-direction:column;gap:18px">
    <div class="card"><div class="card-hdr"><div class="card-title">Dados da Loja</div></div><div class="card-body">
      <div class="fg"><label class="fl">Nome da Loja</label><input class="fc" id="cfg-n" value="${cfg.name||''}"></div>
      <div class="fr fr2">
        <div class="fg"><label class="fl">Margem Padrão (%)</label><input class="fc" type="number" id="cfg-m" value="${cfg.margin||100}"></div>
        <div class="fg"><label class="fl">Estoque Mínimo p/ Alerta</label><input class="fc" type="number" id="cfg-s" value="${cfg.minStock||5}"></div>
      </div>
      <button class="btn btn-pri" onclick="saveCfg()">Salvar Configurações</button>
    </div></div>
    <div class="card" style="border-color:#fca5a5"><div class="card-hdr"><div class="card-title" style="color:var(--err)">⚠️ Zona de Perigo</div></div><div class="card-body">
      <p style="font-size:13px;color:var(--muted);margin-bottom:14px">Esta ação é irreversível e apaga todos os dados do sistema.</p>
      <button class="btn btn-err" onclick="clearAll()">🗑️ Limpar Todos os Dados</button>
    </div></div>

    <div class="card" style="margin-top:0;border-color:#d4a462">
      <div class="card-hdr" style="background:#fffbf0"><div class="card-title" style="color:#a07010">🏷️ Aplicar Tabela de Preços</div></div>
      <div class="card-body">
        <p style="font-size:13px;color:var(--muted);margin-bottom:6px">Aplica a regra de arredondamento nos produtos já cadastrados no sistema:</p>
        <ul style="font-size:12.5px;color:var(--muted);margin:0 0 14px 16px;line-height:1.8">
          <li>Preço até R$ 11,50 → <strong>R$ 10,00</strong></li>
          <li>Preço R$ 11,51 a R$ 16,50 → <strong>R$ 15,00</strong></li>
          <li>Preço R$ 16,51 a R$ 20,00 → <strong>R$ 25,00</strong></li>
          <li>Acima de R$ 20,00 → <strong>mantém o valor atual</strong></li>
        </ul>
        <button class="btn" style="background:#d4a462;color:#fff" onclick="runPriceTable()">⚡ Aplicar Agora em Todos os Produtos</button>
        <div id="price-table-result" style="margin-top:10px;font-size:12.5px"></div>
      </div>
    </div>
  </div>`;
}
function saveCfg(){
  sCfg({name:document.getElementById('cfg-n').value.trim()||'Beauty PDV',margin:parseFloat(document.getElementById('cfg-m').value)||100,minStock:parseInt(document.getElementById('cfg-s').value)||5});
  syncStoreName();toast('Configurações salvas!');
}
function clearAll(){
  if(!confirm('Isso vai apagar TODOS os dados.\nNão pode ser desfeito!\n\nTem certeza?'))return;
  Object.values(K).forEach(k=>localStorage.removeItem(k));
  toast('Dados apagados. Recarregando...','warn');setTimeout(()=>location.reload(),1500);
}

// ── CLOSE DROPDOWNS ON CLICK OUTSIDE ────────────────────────
document.addEventListener('click',e=>{
  if(!e.target.closest('#pdv-search')&&!e.target.closest('#pdv-dd'))document.getElementById('pdv-dd')?.setAttribute('style','display:none');
  if(!e.target.closest('#pdv-cs')&&!e.target.closest('#pdv-cdd'))document.getElementById('pdv-cdd')?.setAttribute('style','display:none');
  if(!e.target.closest('#pdv-customer-search')&&!e.target.closest('#pdv-customer-dropdown'))document.getElementById('pdv-customer-dropdown')?.setAttribute('style','display:none');
});

function runPriceTable(){
  if(!confirm('Aplicar tabela de preços em todos os produtos? Os preços atuais serão substituídos.'))return;
  const ps=gP();
  let changed=0,skipped=[];
  ps.forEach(pr=>{
    const np=applyPriceTable(pr.price);
    if(np!==pr.price){pr.price=np;changed++;}
    else if(pr.price>20)skipped.push(pr.name);
  });
  sP(ps);
  const el=document.getElementById('price-table-result');
  if(el){
    el.innerHTML=`<span style="color:var(--ok)">✅ ${changed} produto(s) atualizado(s).</span>${skipped.length?`<br><span style="color:var(--warn)">⚠️ ${skipped.length} fora da faixa (>R$20): ${skipped.join(', ')}</span>`:''}`;
  }
  toast(`${changed} preços atualizados!`);
}

// ── INIT ─────────────────────────────────────────────────────
seed();
go('pdv');
</script>
