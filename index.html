// ── TOAST ────────────────────────────────────────────────────
function toast(msg,type='ok'){
  const c=document.getElementById('toasts');
  const t=document.createElement('div');
  t.className=`toast t-${type}`;t.textContent=msg;c.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

// ── MODAL ────────────────────────────────────────────────────
function openModal(html){
  const ov=document.createElement('div');ov.className='mo';ov.id='mo';
  ov.innerHTML=html;ov.addEventListener('click',e=>{if(e.target===ov)closeModal();});
  document.body.appendChild(ov);
}
function closeModal(){const m=document.getElementById('mo');if(m)m.remove();}

// ── NAVIGATION ───────────────────────────────────────────────
let curPage='';
function go(page){
  curPage=page;
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  const n=document.getElementById('nav-'+page);if(n)n.classList.add('active');
  const map={pdv:pdvPage,clientes:clientesPage,produtos:produtosPage,historico:historicoPage,estoque:estoquePage,relatorios:relatoriosPage,previsao:previsaoPage,custos:custosPage,payback:paybackPage,config:configPage};
  const main=document.getElementById('main');
  if(map[page]){main.innerHTML=map[page]();afterGo(page);}
  syncStoreName();
}
function afterGo(p){
  if(p==='relatorios')setTimeout(initCharts,60);
  if(p==='previsao')setTimeout(initPrevisaoCharts,60);
  if(p==='pdv'){cart=[];selCust=null;discVal=0;discType='fixed';pays=[];payRows=1;renderCart();_bcBuffer='';if(_bcTimer){clearTimeout(_bcTimer);_bcTimer=null;}setTimeout(()=>document.getElementById('pdv-search')?.focus(),50);}
}
function syncStoreName(){
  const cfg=gCfg();
  ['store-name'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=cfg.name||'Beauty PDV';});
  document.title=(cfg.name||'Beauty PDV')+' — PDV';
}

function prodTable(ps){

  return`<table><thead><tr><th>Produto</th><th>Cat.</th><th>Código</th><th>Custo</th><th>Preço</th><th>Margem</th><th>Estoque</th><th></th></tr></thead><tbody>
  ${ps.map(p=>{
    const mg=p.cost>0?((p.price-p.cost)/p.cost*100).toFixed(0):0;
    const sc=p.stock<=0?'b-err':p.stock<=min?'b-warn':'b-ok';
    return`<tr>
      <td><strong>${p.name}</strong><br><small style="color:var(--muted)">${p.unit||'un'}</small></td>
      <td><span class="badge b-info">${p.category}</span></td>

      <td>${R(p.cost)}</td><td><strong>${R(p.price)}</strong></td>
      <td><span class="badge ${parseInt(mg)>=30?'b-ok':'b-warn'}">${mg}%</span></td>
      <td><span class="badge ${sc}"><span class="si-dot ${p.stock<=0?'si-zero':p.stock<=min?'si-low':'si-ok'}"></span>${p.stock} ${p.unit||'un'}</span></td>
      <td style="text-align:right">
        <button class="btn-ic" onclick="openProdModal('${p.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="btn-ic" onclick="delProd('${p.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>
      </td></tr>`}).join('')}</tbody></table>`;
}
function filterProds(q,cat){
  cat=cat||document.getElementById('sc')?.value||'';
  let ps=gP().filter(p=>p.name.toLowerCase().includes((q||'').toLowerCase())||(p.barcode||'').includes(q||''));
  if(cat)ps=ps.filter(p=>p.category===cat);
  document.getElementById('prod-tbl').innerHTML=prodTable(ps);
}
function openProdModal(id){
  const p=id?gP().find(x=>x.id===id):null;const cfg=gCfg();
  openModal(`<div class="modal modal-lg"><div class="mhdr"><div class="mtitle">${p?'Editar':'Novo'} Produto</div><button class="btn-ic" onclick="closeModal()">✕</button></div>
  <div class="mbody">
    <div class="fg"><label class="fl">Nome *</label><input class="fc" id="pn" value="${p?p.name:''}" placeholder="Ex: Base Líquida Matte"></div>
    <div class="fr fr2">
      <div class="fg"><label class="fl">Código de Barras</label><input class="fc" id="pb" value="${p?p.barcode||'':''}" placeholder="Leia ou digite"></div>
      <div class="fg"><label class="fl">Categoria *</label><select class="fc" id="pcat">${CATS.map(c=>`<option${p&&p.category===c?' selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    <div class="fr fr3">
      <div class="fg"><label class="fl">Custo (R$) *</label><input class="fc" type="number" step="0.01" id="pco" value="${p?p.cost:''}" placeholder="0,00" oninput="calcMg()"></div>
      <div class="fg"><label class="fl">Preço Venda *</label><input class="fc" type="number" step="0.01" id="ppr" value="${p?p.price:''}" placeholder="0,00" oninput="calcMgFromPr()"></div>
      <div class="fg"><label class="fl">Margem (%)</label><input class="fc" type="number" id="pmg" value="${p?((p.price-p.cost)/p.cost*100).toFixed(0):cfg.margin}" oninput="calcPrFromMg()"></div>
    </div>
    <div id="mg-info" style="font-size:12px;color:var(--ok);margin-top:-8px;margin-bottom:12px"></div>
    <div class="fr fr3">
      <div class="fg"><label class="fl">Estoque Atual</label><input class="fc" type="number" id="pst" value="${p?p.stock:0}" min="0"></div>
      <div class="fg"><label class="fl">Estoque Mínimo</label><input class="fc" type="number" id="pms" value="${p?p.minStock:cfg.minStock}" min="0"></div>
      <div class="fg"><label class="fl">Unidade</label><select class="fc" id="pun"><option${p&&p.unit==='un'?' selected':''}>un</option><option${p&&p.unit==='ml'?' selected':''}>ml</option><option${p&&p.unit==='g'?' selected':''}>g</option></select></div>
    </div>
  </div>
  <div class="mftr"><button class="btn btn-sec" onclick="closeModal()">Cancelar</button><button class="btn btn-pri" onclick="saveProd('${id||''}')">Salvar Produto</button></div></div>`);
  calcMg();
}
function calcMg(){
  const co=parseFloat(document.getElementById('pco')?.value)||0;
  const mg=parseFloat(document.getElementById('pmg')?.value)||100;
  if(co>0){const pr=co*(1+mg/100);document.getElementById('ppr').value=pr.toFixed(2);document.getElementById('mg-info').textContent=`💡 Preço com ${mg}% de margem: ${R(pr)}`;}
}
function calcMgFromPr(){
  const co=parseFloat(document.getElementById('pco')?.value)||0;
  const pr=parseFloat(document.getElementById('ppr')?.value)||0;
  if(co>0&&pr>0){const mg=((pr-co)/co*100).toFixed(1);document.getElementById('pmg').value=mg;document.getElementById('mg-info').textContent=`📊 Margem: ${mg}% sobre o custo`;}
}
function calcPrFromMg(){calcMg();}
function saveProd(id){
  const name=document.getElementById('pn').value.trim();
  const barcode=document.getElementById('pb').value.trim();
  const category=document.getElementById('pcat').value;
  const cost=parseFloat(document.getElementById('pco').value)||0;
  const price=parseFloat(document.getElementById('ppr').value)||0;
  const stock=parseInt(document.getElementById('pst').value)||0;
  const minStock=parseInt(document.getElementById('pms').value)||0;
  const unit=document.getElementById('pun').value;
  if(!name||!category||cost<=0||price<=0){toast('Preencha os campos obrigatórios','err');return;}
  const ps=gP();const ms=gM();
  if(id){
    const i=ps.findIndex(x=>x.id===id);const old=ps[i].stock;
    ps[i]={...ps[i],name,barcode,category,cost,price,stock,minStock,unit};
    if(stock!==old)ms.push({id:uid(),productId:id,productName:name,type:stock>old?'in':'out',qty:stock-old,note:'Ajuste manual',createdAt:new Date().toISOString()});
  }else{
    const nid=uid();ps.push({id:nid,name,barcode,category,cost,price,stock,minStock,unit});
    if(stock>0)ms.push({id:uid(),productId:nid,productName:name,type:'in',qty:stock,note:'Estoque inicial',createdAt:new Date().toISOString()});
  }
  sP(ps);sM(ms);closeModal();toast(id?'Produto atualizado!':'Produto cadastrado!');go('produtos');
}
function delProd(id){if(!confirm('Excluir produto?'))return;sP(gP().filter(x=>x.id!==id));toast('Removido','warn');go('produtos');}

let cart=[],selCust=null,discVal=0,discType='fixed',pays=[],payRows=1,srRes=[];

          </div>`).join('')}
          ${ps.length===0?`<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:20px;font-size:13px">Cadastre produtos primeiro</div>`:''}

      </div>

    <div class="card pdv-cart">
      <div class="card-hdr"><div class="card-title">🛒 Carrinho</div><button class="btn btn-err btn-sm" onclick="clearCart()">Limpar</button></div>

      <div class="c-sum" id="cart-sum">
        <div class="sr"><span>Subtotal</span><span id="c-sub">R$ 0,00</span></div>
        <div class="sr" style="gap:8px;margin-bottom:10px;align-items:center">
          <span>Desconto</span>
          <div style="display:flex;gap:5px">
            <select class="fc" style="width:60px;padding:4px 6px;font-size:12px" id="d-type" onchange="updDisc()"><option value="fixed">R$</option><option value="percent">%</option></select>
            <input class="fc" type="number" style="width:75px;padding:4px 8px;font-size:12.5px" id="d-val" value="0" min="0" oninput="updDisc()">

        <div class="sr total"><span>Total</span><span id="c-tot" style="font-family:'Cormorant Garamond',serif;font-size:21px">R$ 0,00</span></div>

function pdvSrch(q){
  const dd=document.getElementById('pdv-dd');
  if(!q||!q.trim()){dd.style.display='none';return;}
  q=q.trim();
  // Busca por código de barras exato primeiro, depois por nome
  srRes=gP().filter(p=>{
    const bcMatch=p.barcode&&(p.barcode.trim().toLowerCase()===q.toLowerCase()||p.barcode.trim()===q);
    const nameMatch=p.name.toLowerCase().includes(q.toLowerCase());
    return bcMatch||nameMatch;
  }).slice(0,8);
  if(!srRes.length){dd.style.display='none';return;}
  dd.innerHTML=srRes.map(p=>`<div class="ac-item" onclick="addToCart('${p.id}');clearPdvSearch()">
    <div><div style="font-weight:500">${p.name}</div><div style="font-size:11px;color:var(--muted)">${p.category} · Est: ${p.stock} · <span style="font-family:monospace">${p.barcode||'—'}</span></div></div>
    <div style="font-weight:700;color:var(--pri)">${R(p.price)}</div>
  </div>`).join('');
  dd.style.display='block';
}

function clearPdvSearch(){
  const el=document.getElementById('pdv-search');
  if(el){el.value='';el.focus();}
  const dd=document.getElementById('pdv-dd');
  if(dd)dd.style.display='none';
}

// Buffer para leitor de código de barras USB
// Leitores digitam muito rápido (< 50ms entre teclas) — detectamos pelo tempo
let _bcBuffer='', _bcTimer=null;
function pdvBarcodeInput(e){
  // Limpa timer anterior
  if(_bcTimer)clearTimeout(_bcTimer);
  _bcBuffer=e.target.value;
  // Aciona busca imediatamente para feedback visual
  pdvSrch(_bcBuffer);
  // Timer: se nada digitar em 80ms, considera que o leitor terminou
  _bcTimer=setTimeout(()=>{
    const q=_bcBuffer.trim();
    if(!q)return;
    // Tenta match exato de código de barras
    const exact=gP().find(p=>p.barcode&&p.barcode.trim().toLowerCase()===q.toLowerCase());
    if(exact){addToCart(exact.id);clearPdvSearch();_bcBuffer='';}
    _bcTimer=null;
  },80);
}

function pdvKey(e){
  if(e.key==='Enter'){
    if(_bcTimer){clearTimeout(_bcTimer);_bcTimer=null;}
    const q=(e.target.value||'').trim();
    if(!q)return;
    // Match exato de código
    const exact=gP().find(p=>p.barcode&&p.barcode.trim().toLowerCase()===q.toLowerCase());
    if(exact){addToCart(exact.id);clearPdvSearch();_bcBuffer='';return;}
    // Se só tem 1 resultado na lista, adiciona
    if(srRes.length===1){addToCart(srRes[0].id);clearPdvSearch();_bcBuffer='';return;}
    // Se tem vários, apenas fecha o dropdown
    if(srRes.length===0)toast('Produto não encontrado','warn');
  }
  if(e.key==='Escape'){
    document.getElementById('pdv-dd').style.display='none';
    _bcBuffer='';
  }
}
function pdvCustSrch(q){
  const dd=document.getElementById('pdv-cdd');
  if(!q){dd.style.display='none';return;}
  const res=gC().filter(c=>c.name.toLowerCase().includes(q.toLowerCase())||c.phone.includes(q)).slice(0,5);
  if(!res.length){dd.style.display='none';return;}
  dd.innerHTML=res.map(c=>`<div class="ac-item" onclick="selPdvCust('${c.id}')"><div><div style="font-weight:500">${c.name}</div><div style="font-size:11px;color:var(--muted)">${c.phone}</div></div></div>`).join('');
  dd.style.display='block';
}
function selPdvCust(id){
  const c=gC().find(x=>x.id===id);if(!c)return;
  selCust=c;document.getElementById('pdv-cs').value=c.name;document.getElementById('pdv-cdd').style.display='none';
  document.getElementById('pdv-cust-lbl').textContent=`👤 ${c.name} — ${c.phone}`;
}
function clearPdvCust(){selCust=null;document.getElementById('pdv-cs').value='';document.getElementById('pdv-cust-lbl').textContent='👤 Sem cliente';}

function addToCart(pid){
  const p=gP().find(x=>x.id===pid);if(!p)return;
  if(p.stock<=0){toast('Produto sem estoque!','err');return;}
  const ex=cart.find(i=>i.id===pid);
  if(ex){if(ex.qty>=p.stock){toast('Estoque insuficiente!','err');return;}ex.qty++;}
  else cart.push({id:p.id,name:p.name,price:p.price,qty:1,maxQty:p.stock});
  renderCart();document.getElementById('pdv-search')?.focus();
}
function updQty(idx,v){
  const q=parseInt(v)||1;const it=cart[idx];
  if(q>it.maxQty){toast('Estoque insuficiente!','err');cart[idx].qty=it.maxQty;}
  else if(q<=0)cart.splice(idx,1);
  else cart[idx].qty=q;
  renderCart();
}
function rmCart(idx){cart.splice(idx,1);renderCart();}
function clearCart(){cart=[];discVal=0;document.getElementById('d-val').value='0';renderCart();}
function updDisc(){discType=document.getElementById('d-type').value;discVal=parseFloat(document.getElementById('d-val').value)||0;renderTotals();}

function getTotal(){
  const sub=cart.reduce((s,i)=>s+i.price*i.qty,0);
  let d=discType==='percent'?sub*discVal/100:discVal;
  return Math.max(0,sub-Math.min(d,sub));
}
function getSub(){return cart.reduce((s,i)=>s+i.price*i.qty,0);}

function renderCart(){
  const el=document.getElementById('cart-items');if(!el)return;
  if(!cart.length){el.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><p>Carrinho vazio</p></div>`;renderTotals();return;}
  el.innerHTML=cart.map((it,i)=>`<div class="cart-item">
    <div class="ci-info"><div class="ci-name">${it.name}</div><div class="ci-price">${R(it.price)} × ${it.qty} = <strong>${R(it.price*it.qty)}</strong></div></div>
    <div class="qty-ctrl">
      <button class="qbtn" onclick="updQty(${i},${it.qty-1})">−</button>
      <input class="qinp" type="number" value="${it.qty}" min="1" max="${it.maxQty}" onchange="updQty(${i},this.value)">
      <button class="qbtn" onclick="updQty(${i},${it.qty+1})">+</button>
      <button class="btn-ic" onclick="rmCart(${i})"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg></button>
    </div>
  </div>`).join('');
  renderTotals();
}
function renderTotals(){
  const s=document.getElementById('c-sub');const t=document.getElementById('c-tot');
  if(s)s.textContent=R(getSub());if(t)t.textContent=R(getTotal());
}

// ── PAYMENT MODAL ─────────────────────────────────────────────
let selPay='Pix';
function openPayModal(){
  if(!cart.length){toast('Carrinho vazio!','err');return;}
  const tot=getTotal();pays=[{method:'Pix',amount:tot}];payRows=1;
  openModal(`<div class="modal"><div class="mhdr"><div class="mtitle">💳 Pagamento</div><button class="btn-ic" onclick="closeModal()">✕</button></div>
  <div class="mbody">
    <div style="font-size:20px;font-weight:700;color:var(--pri);text-align:center;margin-bottom:18px;font-family:'Cormorant Garamond',serif">Total: ${R(tot)}</div>
    <label class="fl">Forma de pagamento</label>
    <div class="pay-methods">
      ${['Dinheiro','Cartão de Crédito','Cartão de Débito','Pix'].map(m=>`<button class="pay-btn${m==='Pix'?' sel':''}" onclick="selPayMethod(this,'${m}')">${m==='Dinheiro'?'💵':m==='Pix'?'📲':m==='Cartão de Crédito'?'💳':'🏦'} ${m}</button>`).join('')}
    </div>
    <div id="pay-rows">
      <div class="sr" style="margin-top:10px;align-items:center"><span id="pay-lbl-0" style="font-weight:600">Pix</span>
      <input class="fc" type="number" step="0.01" value="${tot.toFixed(2)}" style="width:115px;text-align:right" id="pamt-0" oninput="syncPays()"></div>
    </div>
    <div id="cash-row" style="display:none;margin-top:12px;background:var(--bg);padding:12px;border-radius:8px">
      <div class="sr" style="align-items:center;margin-bottom:6px"><span>Valor recebido</span><input class="fc" type="number" step="0.01" id="cash-recv" placeholder="0,00" style="width:115px;text-align:right" oninput="calcChange()"></div>
      <div class="sr" style="font-weight:700;color:var(--ok)"><span>Troco</span><span id="troco">R$ 0,00</span></div>
    </div>
    <button class="btn btn-sec btn-sm" onclick="splitPay()" style="margin-top:8px">+ Dividir pagamento</button>
    <div id="pay-check" style="margin-top:10px;font-size:12.5px"></div>
  </div>
  <div class="mftr"><button class="btn btn-sec" onclick="closeModal()">Cancelar</button><button class="btn btn-ok" style="font-size:14px;padding:9px 22px" onclick="finSale()">✓ Confirmar Venda</button></div>
  </div>`);
  syncPays();
}
function selPayMethod(btn,m){
  document.querySelectorAll('.pay-btn').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');selPay=m;
  const lbl=document.getElementById('pay-lbl-0');if(lbl)lbl.textContent=m;
  pays[0].method=m;
  document.getElementById('cash-row').style.display=m==='Dinheiro'?'block':'none';
  syncPays();
}
function syncPays(){
  const tot=getTotal();
  for(let i=0;i<pays.length;i++){const el=document.getElementById(`pamt-${i}`);if(el)pays[i].amount=parseFloat(el.value)||0;}
  const paid=pays.reduce((s,p)=>s+p.amount,0);const diff=tot-paid;
  const chk=document.getElementById('pay-check');
  if(chk){
    if(Math.abs(diff)<0.01)chk.innerHTML='<span style="color:var(--ok)">✓ Valor correto</span>';
    else if(diff>0)chk.innerHTML=`<span style="color:var(--err)">Falta ${R(diff)}</span>`;
    else chk.innerHTML=`<span style="color:var(--warn)">Excedente ${R(-diff)}</span>`;
  }
}
function splitPay(){
  payRows++;const idx=payRows-1;
  pays.push({method:'Pix',amount:0});
  const rows=document.getElementById('pay-rows');
  const d=document.createElement('div');
  d.className='sr';d.style.cssText='margin-top:8px;align-items:center;gap:8px';
  d.innerHTML=`<select class="fc" style="flex:1" onchange="pays[${idx}].method=this.value">${['Dinheiro','Cartão de Crédito','Cartão de Débito','Pix'].map(m=>`<option>${m}</option>`).join('')}</select>
  <input class="fc" type="number" step="0.01" value="0" style="width:115px;text-align:right" id="pamt-${idx}" oninput="syncPays()">`;
  rows.appendChild(d);syncPays();
}
function calcChange(){
  const tot=getTotal();const recv=parseFloat(document.getElementById('cash-recv').value)||0;
  const troco=recv-tot;const el=document.getElementById('troco');
  el.textContent=R(Math.max(0,troco));el.style.color=troco>=0?'var(--ok)':'var(--err)';
}
function finSale(){
  if(!cart.length){toast('Carrinho vazio!','err');return;}
  syncPays();
  const tot=getTotal();const paid=pays.reduce((s,p)=>s+p.amount,0);
  const hasCash=pays.some(p=>p.method==='Dinheiro');
  if(!hasCash&&Math.abs(paid-tot)>0.01){toast('Valor não confere com o total!','err');return;}
  const ps=gP();const ms=gM();
  for(const it of cart){
    const i=ps.findIndex(p=>p.id===it.id);
    if(i<0||ps[i].stock<it.qty){toast(`Estoque insuficiente: ${it.name}`,'err');return;}
    ps[i].stock-=it.qty;
  }
  const sub=getSub();let disc=discType==='percent'?sub*discVal/100:discVal;disc=Math.min(disc,sub);
  const sale={id:uid(),customerId:selCust?.id||null,customerName:selCust?.name||null,customerPhone:selCust?.phone||null,items:cart.map(i=>({...i})),subtotal:sub,discount:disc,discountType:discType,total:tot,payments:pays.map(p=>({...p})),createdAt:new Date().toISOString(),cancelled:false};
  cart.forEach(it=>ms.push({id:uid(),productId:it.id,productName:it.name,type:'sale',qty:-it.qty,note:`Venda #${sale.id.slice(-4)}`,createdAt:sale.createdAt,saleId:sale.id}));
  const ss=gS();ss.push(sale);sS(ss);sP(ps);sM(ms);
  closeModal();
  cart=[];selCust=null;discVal=0;pays=[];payRows=1;selPay='Pix';
  openSaleSuccessModal(sale);
}

let _lastReceiptCanvas=null;
function drawReceipt(sale){
  const cfg=gCfg();const storeName=cfg.name||'Beauty Store';
  const W=520,PAD=28;
  const rows=sale.items.length;
  const H=300+rows*36+(sale.discount>0?30:0)+60;
  const cv=document.getElementById('receipt-canvas');if(!cv)return;
  cv.width=W;cv.height=H;_lastReceiptCanvas=cv;
  const c=cv.getContext('2d');

  // BG
  c.fillStyle='#ffffff';c.fillRect(0,0,W,H);

  // HEADER gradient bar
  const hg=c.createLinearGradient(0,0,W,90);hg.addColorStop(0,'#1a0826');hg.addColorStop(1,'#2d1040');
  c.fillStyle=hg;c.beginPath();c.roundRect(0,0,W,90,0);c.fill();

  // Logo circle
  c.fillStyle='#c4687a';c.beginPath();c.arc(PAD+28,45,28,0,Math.PI*2);c.fill();
  c.fillStyle='#ffffff';c.font='bold 22px serif';c.textAlign='center';c.textBaseline='middle';
  c.fillText('✦',PAD+28,46);

  // Store name
  c.fillStyle='#ffffff';c.font='bold 19px sans-serif';c.textAlign='left';c.textBaseline='middle';
  c.fillText(storeName,PAD+70,36);
  c.fillStyle='rgba(255,255,255,.5)';c.font='11px sans-serif';
  c.fillText('Comprovante de Venda',PAD+70,56);

  // Date right
  c.fillStyle='rgba(255,255,255,.55)';c.font='11px sans-serif';c.textAlign='right';
  c.fillText(new Date(sale.createdAt).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}),W-PAD,36);
  c.fillText('#'+sale.id.slice(-6).toUpperCase(),W-PAD,54);

  // Pink divider
  c.fillStyle='#c4687a';c.fillRect(0,90,W,4);

  // Customer row
  let y=114;
  if(sale.customerName){
    c.fillStyle='#f3e8f0';c.beginPath();c.roundRect(PAD,y-10,W-PAD*2,28,6);c.fill();
    c.fillStyle='#6b2d5e';c.font='12px sans-serif';c.textAlign='left';c.textBaseline='middle';
    c.fillText(`👤 ${sale.customerName}${sale.customerPhone?' · '+sale.customerPhone:''}`,PAD+8,y+4);
    y+=38;
  }

  // Items header
  c.fillStyle='#f7f2f5';c.fillRect(PAD,y,W-PAD*2,24);
  c.fillStyle='#8a7078';c.font='bold 10px sans-serif';c.textBaseline='middle';
  c.textAlign='left';c.fillText('PRODUTO',PAD+8,y+12);
  c.textAlign='center';c.fillText('QTD',W-PAD-100,y+12);
  c.textAlign='right';c.fillText('SUBTOTAL',W-PAD,y+12);
  y+=28;

  // Items
  sale.items.forEach((it,i)=>{
    if(i%2===0){c.fillStyle='#fdf9fb';c.fillRect(PAD,y,W-PAD*2,34);}
    c.fillStyle='#2d1a22';c.font='13px sans-serif';c.textAlign='left';c.textBaseline='middle';
    const maxW=W-PAD*2-170;
    let nm=it.name;
    // truncate if needed
    c.font='13px sans-serif';
    while(c.measureText(nm).width>maxW&&nm.length>10)nm=nm.slice(0,-2)+'…';
    c.fillText(nm,PAD+8,y+12);
    c.fillStyle='#8a7078';c.font='11px sans-serif';
    c.fillText(`${R(it.price)} × ${it.qty}`,PAD+8,y+25);
    c.fillStyle='#2d1a22';c.font='bold 13px sans-serif';c.textAlign='center';
    c.fillText(it.qty,W-PAD-100,y+17);
    c.textAlign='right';
    c.fillText(R(it.price*it.qty),W-PAD,y+17);
    y+=34;
  });

  // Divider
  c.strokeStyle='#e8d9df';c.lineWidth=1;c.beginPath();c.moveTo(PAD,y+6);c.lineTo(W-PAD,y+6);c.stroke();y+=16;

  // Subtotal
  if(sale.discount>0){
    c.fillStyle='#8a7078';c.font='13px sans-serif';c.textAlign='left';c.textBaseline='middle';c.fillText('Subtotal',PAD+8,y+8);
    c.textAlign='right';c.fillText(R(sale.subtotal),W-PAD,y+8);y+=28;
    c.fillStyle='#c4687a';c.textAlign='left';c.fillText('Desconto',PAD+8,y+8);
    c.textAlign='right';c.fillText('- '+R(sale.discount),W-PAD,y+8);y+=28;
  }

  // TOTAL bar
  const tg=c.createLinearGradient(0,y,W,y+46);tg.addColorStop(0,'#b5546a');tg.addColorStop(1,'#963049');
  c.fillStyle=tg;c.beginPath();c.roundRect(PAD,y,W-PAD*2,46,8);c.fill();
  c.fillStyle='#fff';c.font='bold 14px sans-serif';c.textAlign='left';c.textBaseline='middle';
  c.fillText('TOTAL',PAD+16,y+23);
  c.font='bold 22px serif';c.textAlign='right';
  c.fillText(R(sale.total),W-PAD-10,y+23);
  y+=58;

  // Payments
  sale.payments.forEach(pm=>{
    c.fillStyle='#555';c.font='12px sans-serif';c.textAlign='left';c.textBaseline='middle';
    const icon=pm.method==='Pix'?'📲':pm.method==='Dinheiro'?'💵':pm.method==='Cartão de Crédito'?'💳':'🏦';
    c.fillText(`${icon} ${pm.method}`,PAD+8,y);
    c.textAlign='right';c.fillText(R(pm.amount),W-PAD,y);
    y+=20;
  });
  y+=8;

  // Footer
  c.fillStyle='#f7f2f5';c.fillRect(0,y,W,H-y);
  c.fillStyle='#c4687a';c.font='bold 12px sans-serif';c.textAlign='center';c.textBaseline='middle';
  c.fillText('✦ Obrigada pela preferência! ✦',W/2,y+18);
  c.fillStyle='#aaa';c.font='10px sans-serif';
  c.fillText(storeName+' · '+new Date().toLocaleDateString('pt-BR'),W/2,y+34);
}

function historicoPage(){
  const ss=gS().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const tot=ss.filter(s=>!s.cancelled).reduce((s,v)=>s+v.total,0);
  return`<div class="pg-hdr"><div><div class="pg-title">Histórico de Vendas</div><div class="pg-sub">${ss.length} venda(s) · Faturamento: ${R(tot)}</div></div></div>
  <div class="card"><div class="card-hdr" style="gap:10px;flex-wrap:wrap">
    <div class="fr fr3" style="gap:10px;flex:1">
      <div><label class="fl">De</label><input class="fc" type="date" id="hf" oninput="filterHist()"></div>
      <div><label class="fl">Até</label><input class="fc" type="date" id="ht" oninput="filterHist()"></div>
      <div><label class="fl">Pagamento</label><select class="fc" id="hp" onchange="filterHist()"><option value="">Todos</option>${['Dinheiro','Cartão de Crédito','Cartão de Débito','Pix'].map(m=>`<option>${m}</option>`).join('')}</select></div>
    </div>
    <div id="hist-total-lbl" style="font-size:13px;color:var(--muted);align-self:flex-end"></div>
  </div>
  <div class="tw" id="hist-tbl">${histTable(ss)}</div></div>`;
}
function histTable(ss){
  if(!ss.length)return`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 3v5h5"/></svg><p>Nenhuma venda</p></div>`;
  return`<table><thead><tr><th>Data/Hora</th><th>Cliente</th><th>Itens</th><th>Pagamento</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>
  ${ss.map(s=>`<tr style="${s.cancelled?'opacity:.55;background:#fff8f8':''}">
    <td style="font-size:12px">${D(s.createdAt)}</td>
    <td>${s.customerName||'<span style="color:var(--muted)">—</span>'}</td>
    <td>${s.items.length}</td>
    <td style="font-size:12px">${s.payments.map(p=>p.method).join(' + ')}</td>
    <td><strong>${R(s.total)}</strong>${s.discount>0?`<br><small style="color:var(--muted)">Desc: ${R(s.discount)}</small>`:''}</td>
    <td><span class="badge ${s.cancelled?'b-err':'b-ok'}">${s.cancelled?'Cancelada':'Finalizada'}</span></td>
    <td style="text-align:right">
      <button class="btn-ic" onclick="viewSale('${s.id}')" title="Detalhes"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      ${!s.cancelled?`<button class="btn-ic" onclick="cancelSale('${s.id}')" title="Cancelar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></button>`:''}
    </td>
  </tr>`).join('')}</tbody></table>`;
}
function filterHist(){
  const f=document.getElementById('hf').value,t=document.getElementById('ht').value,p=document.getElementById('hp').value;
  let ss=gS().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(f)ss=ss.filter(s=>s.createdAt>=f);
  if(t)ss=ss.filter(s=>s.createdAt.slice(0,10)<=t);
  if(p)ss=ss.filter(s=>s.payments.some(x=>x.method===p));
  document.getElementById('hist-tbl').innerHTML=histTable(ss);
  const tot=ss.filter(s=>!s.cancelled).reduce((s,v)=>s+v.total,0);
  const lbl=document.getElementById('hist-total-lbl');if(lbl)lbl.textContent=`Filtrado: ${R(tot)}`;
}
function viewSale(id){
  const s=gS().find(x=>x.id===id);if(!s)return;
  openModal(`<div class="modal modal-lg"><div class="mhdr"><div class="mtitle">Detalhe da Venda</div><button class="btn-ic" onclick="closeModal()">✕</button></div>
  <div class="mbody">
    <div class="fr fr2" style="margin-bottom:14px;font-size:13px">
      <div><strong>Data:</strong> ${D(s.createdAt)}</div>
      <div><strong>Cliente:</strong> ${s.customerName||'—'}</div>
      <div><strong>Status:</strong> <span class="badge ${s.cancelled?'b-err':'b-ok'}">${s.cancelled?'Cancelada':'Finalizada'}</span></div>
      <div><strong>Pagamento:</strong> ${s.payments.map(p=>`${p.method} (${R(p.amount)})`).join(' + ')}</div>
    </div>
    <table style="margin-bottom:14px"><thead><tr><th>Produto</th><th>Qtd</th><th>Unitário</th><th>Subtotal</th></tr></thead><tbody>
      ${s.items.map(i=>`<tr><td>${i.name}</td><td>${i.qty}</td><td>${R(i.price)}</td><td>${R(i.price*i.qty)}</td></tr>`).join('')}
    </tbody></table>
    <div style="text-align:right">
      <div class="sr"><span>Subtotal</span><span>${R(s.subtotal)}</span></div>
      ${s.discount>0?`<div class="sr"><span>Desconto</span><span>- ${R(s.discount)}</span></div>`:''}
      <div class="sr total"><span>Total</span><span>${R(s.total)}</span></div>
    </div>
  </div>
  <div class="mftr"><button class="btn btn-sec" onclick="closeModal()">Fechar</button></div></div>`);
}
function cancelSale(id){
  if(!confirm('Cancelar esta venda e restaurar o estoque?'))return;
  const ss=gS();const s=ss.find(x=>x.id===id);if(!s||s.cancelled)return;
  const ps=gP();const ms=gM();
  s.items.forEach(it=>{const i=ps.findIndex(p=>p.id===it.id);if(i>=0)ps[i].stock+=it.qty;ms.push({id:uid(),productId:it.id,productName:it.name,type:'in',qty:it.qty,note:`Cancelamento #${s.id.slice(-4)}`,createdAt:new Date().toISOString(),saleId:s.id});});
  s.cancelled=true;sS(ss);sP(ps);sM(ms);
  toast('Venda cancelada · estoque restaurado','warn');go('historico');
}

function estoquePage(){
  const ps=gP();const ms=gM().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const cfg=gCfg();const min=cfg.minStock||5;
  const low=ps.filter(p=>p.stock>0&&p.stock<=min);const zero=ps.filter(p=>p.stock<=0);
  return`<div class="pg-hdr"><div><div class="pg-title">Controle de Estoque</div></div>
  <button class="btn btn-pri" onclick="openMovModal()">+ Entrada / Saída Manual</button></div>

  ${low.length?`<div class="alert alert-warn">⚠️ Estoque baixo: ${low.map(p=>p.name).join(' · ')}</div>`:''}
  <div style="display:grid;grid-template-columns:1fr 1.1fr;gap:18px">
    <div class="card">
      <div class="card-hdr">
        <div class="card-title">Produtos</div>
        <select class="fc" style="width:130px" onchange="filterEst(this.value)"><option value="">Todos</option><option value="low">Estoque baixo</option><option value="zero">Sem estoque</option></select>
      </div>
      <div class="tw" id="est-tbl">${estTable(ps,cfg)}</div>
    </div>
    <div class="card">
      <div class="card-hdr"><div class="card-title">Movimentações Recentes</div></div>
      <div class="tw">
        <table><thead><tr><th>Data</th><th>Produto</th><th>Tipo</th><th>Qtd</th><th>Obs</th></tr></thead><tbody>
          ${ms.slice(0,20).map(m=>`<tr>
            <td style="font-size:11.5px">${new Date(m.createdAt).toLocaleDateString('pt-BR')}</td>
            <td style="font-size:12.5px">${m.productName}</td>
            <td><span class="badge ${m.type==='sale'?'b-err':m.type==='in'?'b-ok':'b-warn'}">${m.type==='sale'?'Venda':m.type==='in'?'Entrada':'Saída'}</span></td>
            <td style="font-weight:600;color:${m.qty>0?'var(--ok)':'var(--err)'}">${m.qty>0?'+':''}${m.qty}</td>
            <td style="font-size:11.5px;color:var(--muted)">${m.note||''}</td>
          </tr>`).join('')}
          ${ms.length===0?`<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:20px">Nenhuma movimentação</td></tr>`:''}
        </tbody></table>
      </div>
    </div>
  </div>`;
}
function estTable(ps,cfg){
  const min=cfg?.minStock||5;
  if(!ps.length)return`<div class="empty"><p>Nenhum produto</p></div>`;
  return`<table><thead><tr><th>Produto</th><th>Cat.</th><th>Qtd</th><th>Mín</th></tr></thead><tbody>
  ${ps.map(p=>{const sc=p.stock<=0?'b-err':p.stock<=min?'b-warn':'b-ok';return`<tr><td style="font-size:12.5px"><strong>${p.name}</strong></td><td><span class="badge b-info">${p.category}</span></td><td><span class="badge ${sc}"><span class="si-dot ${p.stock<=0?'si-zero':p.stock<=min?'si-low':'si-ok'}"></span>${p.stock}</span></td><td style="font-size:12px;color:var(--muted)">${p.minStock}</td></tr>`}).join('')}
  </tbody></table>`;
}
function filterEst(f){
  const cfg=gCfg();let ps=gP();const min=cfg.minStock||5;
  if(f==='low')ps=ps.filter(p=>p.stock>0&&p.stock<=min);
  if(f==='zero')ps=ps.filter(p=>p.stock<=0);
  document.getElementById('est-tbl').innerHTML=estTable(ps,cfg);
}
function openMovModal(){
  const ps=gP();
  openModal(`<div class="modal"><div class="mhdr"><div class="mtitle">Movimentação de Estoque</div><button class="btn-ic" onclick="closeModal()">✕</button></div>
  <div class="mbody">
    <div class="fg"><label class="fl">Produto *</label><select class="fc" id="mv-p">${ps.map(p=>`<option value="${p.id}">${p.name} (atual: ${p.stock})</option>`).join('')}</select></div>
    <div class="fr fr2">
      <div class="fg"><label class="fl">Tipo *</label><select class="fc" id="mv-t"><option value="in">Entrada (compra/reposição)</option><option value="out">Saída (perda/uso interno)</option></select></div>
      <div class="fg"><label class="fl">Quantidade *</label><input class="fc" type="number" id="mv-q" min="1" value="1"></div>
    </div>
    <div class="fg"><label class="fl">Observação</label><input class="fc" id="mv-n" placeholder="Ex: Compra NF 001, Produto vencido..."></div>
  </div>
  <div class="mftr"><button class="btn btn-sec" onclick="closeModal()">Cancelar</button><button class="btn btn-pri" onclick="saveMov()">Confirmar</button></div></div>`);
}
function saveMov(){
  const pid=document.getElementById('mv-p').value;
  const type=document.getElementById('mv-t').value;
  const qty=parseInt(document.getElementById('mv-q').value)||0;
  const note=document.getElementById('mv-n').value.trim();
  if(!qty||qty<=0){toast('Informe a quantidade','err');return;}
  const ps=gP();const i=ps.findIndex(p=>p.id===pid);if(i<0)return;
  const delta=type==='in'?qty:-qty;
  if(type==='out'&&ps[i].stock<qty){toast('Quantidade maior que o estoque!','err');return;}
  ps[i].stock+=delta;
  const ms=gM();ms.push({id:uid(),productId:pid,productName:ps[i].name,type,qty:delta,note,createdAt:new Date().toISOString()});
  sP(ps);sM(ms);closeModal();toast(type==='in'?'Entrada registrada!':'Saída registrada!');go('estoque');
}

// RELATÓRIOS
// ═══════════════════════════════════════════════════════════════
function relatoriosPage(){
  const ss=gS().filter(s=>!s.cancelled);
  const today=new Date().toISOString().slice(0,10);
  const todSS=ss.filter(s=>s.createdAt.slice(0,10)===today);
  const mSS=ss.filter(s=>s.createdAt.slice(0,7)===today.slice(0,7));
  const wAgo=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  const wSS=ss.filter(s=>s.createdAt.slice(0,10)>=wAgo);
  const todT=todSS.reduce((s,v)=>s+v.total,0);
  const mT=mSS.reduce((s,v)=>s+v.total,0);
  const wT=wSS.reduce((s,v)=>s+v.total,0);
  const avg=wSS.length?wT/wSS.length:0;
  const pm={};ss.forEach(s=>s.items.forEach(i=>{if(!pm[i.name])pm[i.name]={qty:0,rev:0};pm[i.name].qty+=i.qty;pm[i.name].rev+=i.price*i.qty;}));
  const top=Object.entries(pm).sort((a,b)=>b[1].rev-a[1].rev).slice(0,5);
  return`<div class="pg-hdr"><div><div class="pg-title">Relatórios</div><div class="pg-sub">Visão geral do negócio</div></div></div>
  <div class="stats-g">
    <div class="stat-c"><div class="stat-lbl">Hoje</div><div class="stat-val">${R(todT)}</div><div style="font-size:11.5px;color:var(--muted)">${todSS.length} venda(s)</div></div>
    <div class="stat-c"><div class="stat-lbl">Esta Semana</div><div class="stat-val">${R(wT)}</div><div style="font-size:11.5px;color:var(--muted)">${wSS.length} venda(s)</div></div>
    <div class="stat-c"><div class="stat-lbl">Este Mês</div><div class="stat-val">${R(mT)}</div><div style="font-size:11.5px;color:var(--muted)">${mSS.length} venda(s)</div></div>
    <div class="stat-c"><div class="stat-lbl">Ticket Médio</div><div class="stat-val">${R(avg)}</div><div style="font-size:11.5px;color:var(--muted)">por venda (semana)</div></div>
  </div>
  <div style="display:grid;grid-template-columns:2fr 1fr;gap:18px">
    <div class="card"><div class="card-hdr"><div class="card-title">Faturamento — últimos 7 dias</div></div><div class="card-body"><div class="chart-wrap"><canvas id="ch-rev"></canvas></div></div></div>
    <div class="card"><div class="card-hdr"><div class="card-title">Formas de Pagamento</div></div><div class="card-body"><div class="chart-wrap"><canvas id="ch-pay"></canvas></div></div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
    <div class="card"><div class="card-hdr"><div class="card-title">Top 5 Produtos</div></div>
      <div style="padding:0"><table><thead><tr><th>Produto</th><th>Qtd</th><th>Receita</th></tr></thead><tbody>
        ${top.map(([n,d])=>`<tr><td style="font-size:12.5px">${n}</td><td>${d.qty}</td><td><strong>${R(d.rev)}</strong></td></tr>`).join('')}
        ${top.length===0?`<tr><td colspan="3" style="text-align:center;color:var(--muted);padding:20px">Sem dados</td></tr>`:''}
      </tbody></table></div>
    </div>
    <div class="card"><div class="card-hdr"><div class="card-title">Receita por Categoria</div></div><div class="card-body"><div class="chart-wrap"><canvas id="ch-cat"></canvas></div></div></div>
  </div>`;
}
let chartInstances=[];
function initCharts(){
  chartInstances.forEach(c=>{try{c.destroy();}catch{}});chartInstances=[];
  const ss=gS().filter(s=>!s.cancelled);
  const days=[],revs=[];
  for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5);const ds=d.toISOString().slice(0,10);days.push(d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}));revs.push(ss.filter(s=>s.createdAt.slice(0,10)===ds).reduce((s,v)=>s+v.total,0));}
  const c1=document.getElementById('ch-rev');
  if(c1)chartInstances.push(new Chart(c1,{type:'line',data:{labels:days,datasets:[{label:'Faturamento',data:revs,borderColor:'#c4687a',backgroundColor:'rgba(196,104,122,.12)',tension:.4,fill:true,pointBackgroundColor:'#c4687a',pointRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'R$'+v}}}}}));
  const payMap={};ss.forEach(s=>s.payments.forEach(p=>{payMap[p.method]=(payMap[p.method]||0)+p.amount;}));
  const c2=document.getElementById('ch-pay');
  if(c2&&Object.keys(payMap).length)chartInstances.push(new Chart(c2,{type:'doughnut',data:{labels:Object.keys(payMap),datasets:[{data:Object.values(payMap),backgroundColor:['#c4687a','#d4a462','#4caf7d','#6b9dd4','#a88dd4'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11}}}}}}));
  const catMap={};const ps=gP();ss.forEach(s=>s.items.forEach(i=>{const p=ps.find(x=>x.id===i.id);const cat=p?.category||'Outros';catMap[cat]=(catMap[cat]||0)+i.price*i.qty;}));
  const c3=document.getElementById('ch-cat');
  if(c3&&Object.keys(catMap).length)chartInstances.push(new Chart(c3,{type:'bar',data:{labels:Object.keys(catMap),datasets:[{data:Object.values(catMap),backgroundColor:'rgba(196,104,122,.75)',borderColor:'#c4687a',borderWidth:1.5,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}}));
}

// PREVISÃO DE FATURAMENTO
// ═══════════════════════════════════════════════════════════════
function previsaoPage(){
  const ps=gP();
  const withStock=ps.filter(p=>p.stock>0);
  const totalCusto=ps.reduce((s,p)=>s+p.cost*p.stock,0);
  const totalFat=ps.reduce((s,p)=>s+p.price*p.stock,0);
  const totalLucro=totalFat-totalCusto;
  const mgMedia=totalCusto>0?(totalLucro/totalFat*100):0;
  const totalItens=ps.reduce((s,p)=>s+p.stock,0);
  const semEstoque=ps.filter(p=>p.stock<=0).length;

  // Por categoria
  const catMap={};
  ps.forEach(p=>{
    if(!catMap[p.category])catMap[p.category]={prods:0,itens:0,custo:0,fat:0};
    catMap[p.category].prods++;
    catMap[p.category].itens+=p.stock;
    catMap[p.category].custo+=p.cost*p.stock;
    catMap[p.category].fat+=p.price*p.stock;
  });
  const cats=Object.entries(catMap).sort((a,b)=>b[1].fat-a[1].fat);

  // Top 15 por faturamento potencial
  const topProds=[...ps].filter(p=>p.stock>0).sort((a,b)=>(b.price*b.stock)-(a.price*a.stock)).slice(0,15);

  return`<div class="pg-hdr">
    <div><div class="pg-title">Previsão de Faturamento</div><div class="pg-sub">Se todo o estoque atual for vendido</div></div>
    <div style="font-size:12px;color:var(--muted);text-align:right">${withStock.length} produtos em estoque · ${semEstoque} zerado(s)</div>
  </div>

  <!-- KPIs principais -->
  <div class="stats-g">
    <div class="stat-c" style="border-left:4px solid var(--pri)">
      <div class="stat-lbl">Faturamento Potencial</div>
      <div class="stat-val" style="color:var(--pri)">${R(totalFat)}</div>
      <div style="font-size:11.5px;color:var(--muted)">${totalItens} unidades × preço venda</div>
    </div>
    <div class="stat-c" style="border-left:4px solid var(--ok)">
      <div class="stat-lbl">Lucro Potencial</div>
      <div class="stat-val" style="color:var(--ok)">${R(totalLucro)}</div>
      <div style="font-size:11.5px;color:var(--muted)">após descontar custo</div>
    </div>
    <div class="stat-c" style="border-left:4px solid var(--sec)">
      <div class="stat-lbl">Capital Investido</div>
      <div class="stat-val" style="color:var(--sec)">${R(totalCusto)}</div>
      <div style="font-size:11.5px;color:var(--muted)">custo total do estoque</div>
    </div>
    <div class="stat-c" style="border-left:4px solid #6b9dd4">
      <div class="stat-lbl">Margem Média</div>
      <div class="stat-val" style="color:#6b9dd4">${mgMedia.toFixed(1)}%</div>
      <div style="font-size:11.5px;color:var(--muted)">sobre o faturamento</div>
    </div>
  </div>

  <!-- Gráficos -->
  <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:18px">
    <div class="card">
      <div class="card-hdr"><div class="card-title">💰 Faturamento vs Custo por Categoria</div></div>
      <div class="card-body"><div class="chart-wrap" style="height:240px"><canvas id="ch-prev-cat"></canvas></div></div>
    </div>
    <div class="card">
      <div class="card-hdr"><div class="card-title">🥧 Distribuição do Faturamento</div></div>
      <div class="card-body"><div class="chart-wrap" style="height:240px"><canvas id="ch-prev-pie"></canvas></div></div>
    </div>
  </div>

  <!-- Por Categoria -->
  <div class="card">
    <div class="card-hdr"><div class="card-title">📊 Previsão por Categoria</div></div>
    <div class="tw">
      <table>
        <thead><tr><th>Categoria</th><th>Produtos</th><th>Itens</th><th>Capital Investido</th><th>Faturamento Potencial</th><th>Lucro Potencial</th><th>Margem</th><th>% do Total</th></tr></thead>
        <tbody>
        ${cats.map(([cat,d])=>{
          const mg=d.fat>0?((d.fat-d.custo)/d.fat*100):0;
          const pct=totalFat>0?(d.fat/totalFat*100):0;
          const lucro=d.fat-d.custo;
          const barW=Math.round(pct);
          return`<tr>
            <td><span class="badge b-info">${cat}</span></td>
            <td style="text-align:center">${d.prods}</td>
            <td style="text-align:center">${d.itens}</td>
            <td>${R(d.custo)}</td>
            <td><strong style="color:var(--pri)">${R(d.fat)}</strong></td>
            <td style="color:var(--ok);font-weight:600">${R(lucro)}</td>
            <td><span class="badge ${mg>=40?'b-ok':'b-warn'}">${mg.toFixed(1)}%</span></td>
            <td>
              <div style="display:flex;align-items:center;gap:6px">
                <div style="flex:1;background:var(--bdr);border-radius:4px;height:6px;min-width:60px">
                  <div style="width:${barW}%;background:var(--pri);border-radius:4px;height:6px"></div>
                </div>
                <span style="font-size:11.5px;color:var(--muted);white-space:nowrap">${pct.toFixed(1)}%</span>
              </div>
            </td>
          </tr>`;
        }).join('')}
        </tbody>
        <tfoot>
          <tr style="background:var(--bg);font-weight:700">
            <td><strong>TOTAL</strong></td>
            <td style="text-align:center">${ps.length}</td>
            <td style="text-align:center">${totalItens}</td>
            <td><strong>${R(totalCusto)}</strong></td>
            <td><strong style="color:var(--pri)">${R(totalFat)}</strong></td>
            <td style="color:var(--ok)"><strong>${R(totalLucro)}</strong></td>
            <td><strong>${mgMedia.toFixed(1)}%</strong></td>
            <td><strong>100%</strong></td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

  <!-- Top produtos por faturamento potencial -->
  <div class="card">
    <div class="card-hdr">
      <div class="card-title">🏆 Top 15 — Maior Faturamento Potencial</div>
      <div style="font-size:12px;color:var(--muted)">produtos com estoque disponível</div>
    </div>
    <div class="tw">
      <table>
        <thead><tr><th>#</th><th>Produto</th><th>Cat.</th><th>Estoque</th><th>Custo Unit.</th><th>Preço Venda</th><th>Margem Unit.</th><th>Fat. Potencial</th><th>Lucro Potencial</th></tr></thead>
        <tbody>
        ${topProds.map((p,i)=>{
          const fat=p.price*p.stock;
          const lucro=(p.price-p.cost)*p.stock;
          const mg=p.cost>0?((p.price-p.cost)/p.price*100):0;
          return`<tr>
            <td style="color:var(--muted);font-weight:700;font-size:13px">${i+1}</td>
            <td><strong>${p.name}</strong><br><small style="color:var(--muted);font-family:monospace">${p.barcode}</small></td>
            <td><span class="badge b-info">${p.category}</span></td>
            <td style="text-align:center">
              <span class="badge ${p.stock<=3?'b-warn':'b-ok'}">${p.stock}</span>
            </td>
            <td style="color:var(--muted)">${R(p.cost)}</td>
            <td><strong>${R(p.price)}</strong></td>
            <td><span class="badge ${mg>=40?'b-ok':'b-warn'}">${mg.toFixed(1)}%</span></td>
            <td><strong style="color:var(--pri)">${R(fat)}</strong></td>
            <td style="color:var(--ok);font-weight:600">${R(lucro)}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>
  </div>

  <!-- Produtos zerados - perda de oportunidade -->
  ${semEstoque>0?`<div class="card" style="border-color:#fca5a5">
    <div class="card-hdr" style="background:#fff8f8">
      <div class="card-title" style="color:var(--err)">⚠️ Oportunidade Perdida — Produtos Sem Estoque (${semEstoque})</div>
      <div style="font-size:12px;color:var(--muted)">faturamento não realizável no momento</div>
    </div>
    <div class="tw">
      <table>
        <thead><tr><th>Produto</th><th>Categoria</th><th>Preço Venda</th><th>Ação Sugerida</th></tr></thead>
        <tbody>
        ${ps.filter(p=>p.stock<=0).map(p=>`<tr style="opacity:.7">
          <td><strong>${p.name}</strong></td>
          <td><span class="badge b-info">${p.category}</span></td>
          <td>${R(p.price)}</td>
          <td><span class="badge b-err">Repor estoque</span></td>
        </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`:''}`;
}

let prevCharts=[];
function initPrevisaoCharts(){
  prevCharts.forEach(c=>{try{c.destroy();}catch{}});prevCharts=[];
  const ps=gP();
  const catMap={};
  ps.forEach(p=>{
    if(!catMap[p.category])catMap[p.category]={custo:0,fat:0};
    catMap[p.category].custo+=p.cost*p.stock;
    catMap[p.category].fat+=p.price*p.stock;
  });
  const cats=Object.keys(catMap).sort((a,b)=>catMap[b].fat-catMap[a].fat);

  // Grouped bar: Custo vs Faturamento por categoria
  const c1=document.getElementById('ch-prev-cat');
  if(c1)prevCharts.push(new Chart(c1,{
    type:'bar',
    data:{
      labels:cats,
      datasets:[
        {label:'Capital Investido',data:cats.map(c=>parseFloat(catMap[c].custo.toFixed(2))),backgroundColor:'rgba(212,164,98,.7)',borderColor:'#d4a462',borderWidth:1.5,borderRadius:4},
        {label:'Faturamento Potencial',data:cats.map(c=>parseFloat(catMap[c].fat.toFixed(2))),backgroundColor:'rgba(196,104,122,.75)',borderColor:'#c4687a',borderWidth:1.5,borderRadius:4}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:11}}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'R$'+v.toLocaleString('pt-BR')}}}}
  }));

  // Pie: distribuição do faturamento
  const colors=['#c4687a','#d4a462','#4caf7d','#6b9dd4','#a88dd4','#e07a5f','#81b29a','#f2cc8f'];
  const c2=document.getElementById('ch-prev-pie');
  const fatVals=cats.map(c=>parseFloat(catMap[c].fat.toFixed(2)));
  if(c2&&fatVals.some(v=>v>0))prevCharts.push(new Chart(c2,{
    type:'doughnut',
    data:{labels:cats,datasets:[{data:fatVals,backgroundColor:colors.slice(0,cats.length),borderWidth:2,borderColor:'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11},padding:10}},tooltip:{callbacks:{label:ctx=>{const total=ctx.dataset.data.reduce((a,b)=>a+b,0);const pct=(ctx.parsed/total*100).toFixed(1);return ` ${ctx.label}: R$${ctx.parsed.toFixed(2).replace('.',',')} (${pct}%)`;}}}}}}
  ));
}

const COST_CATS=['Infraestrutura','Marketing','Financeiro','Pessoal','Logística','Impostos','Outros'];

function custosPage(){
  const costs=gCS();
  const fixos=costs.filter(c=>c.type==='fixo'&&c.active);
  const variaveis=costs.filter(c=>c.type==='variavel'&&c.active);
  const totalFixo=fixos.reduce((s,c)=>s+c.value,0);
  const totalVar=variaveis.reduce((s,c)=>s+c.value,0);

  // DRE do mês atual
  const today=new Date().toISOString().slice(0,10);
  const mes=today.slice(0,7);
  const ss=gS().filter(s=>!s.cancelled&&s.createdAt.slice(0,7)===mes);
  const ps=gP();
  const receitaBruta=ss.reduce((s,v)=>s+v.total,0);
  let cmv=0;
  ss.forEach(sale=>sale.items.forEach(it=>{
    const prod=ps.find(p=>p.id===it.id);
    if(prod)cmv+=prod.cost*it.qty;
  }));
  const lucroBruto=receitaBruta-cmv;
  const mgBruta=receitaBruta>0?(lucroBruto/receitaBruta*100):0;
  // custos variáveis como % da receita
  const totalVarValor=variaveis.reduce((s,c)=>s+(c.pct?receitaBruta*c.value/100:c.value),0);
  const lucroOp=lucroBruto-totalFixo-totalVarValor;
  const mgLiq=receitaBruta>0?(lucroOp/receitaBruta*100):0;
  // Ponto de equilíbrio
  const mgBrutaFrac=receitaBruta>0?lucroBruto/receitaBruta:(lucroBruto>0?lucroBruto/1:0.412);
  const peq=mgBrutaFrac>0?(totalFixo+totalVarValor)/mgBrutaFrac:0;
  const peqPct=peq>0&&receitaBruta>0?Math.min((receitaBruta/peq*100),100):0;
  const diasNoMes=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
  const diaEquilibrio=peq>0&&receitaBruta>0?Math.ceil((peq/receitaBruta)*diasNoMes):diasNoMes;

  const dreRow=(lbl,val,sub,bold,color,border)=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;${border?'border-top:2px solid var(--bdr);margin-top:4px;':''}border-bottom:1px solid var(--bdr)">
      <span style="font-size:${bold?'14px':'13px'};font-weight:${bold?'700':'400'};color:${color||'var(--txt)'}">
        ${sub?'<span style="color:var(--muted);margin-right:6px">−</span>':''}${lbl}
      </span>
      <span style="font-size:${bold?'16px':'14px'};font-weight:${bold?'700':'500'};color:${color||'var(--txt)'}">
        ${val}${color==='var(--muted)'?'':''}</span>
    </div>`;

  return`
  <div class="pg-hdr">
    <div><div class="pg-title">Custos & DRE</div><div class="pg-sub">Demonstrativo de Resultado — ${new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</div></div>
    <button class="btn btn-pri" onclick="openCustoModal()">+ Lançar Custo</button>
  </div>

  <!-- DRE Simplificado -->
  <div style="display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start">
    <div class="card">
      <div class="card-hdr" style="background:linear-gradient(135deg,#1a0826,#2d1040)">
        <div class="card-title" style="color:#fff">📋 DRE — ${new Date().toLocaleDateString('pt-BR',{month:'short',year:'numeric'}).toUpperCase()}</div>
        <span class="badge" style="background:rgba(255,255,255,.15);color:#fff;font-size:10px">${ss.length} venda(s)</span>
      </div>
      <div class="card-body">
        ${dreRow('Receita Bruta de Vendas',R(receitaBruta),false,true,'var(--txt)',false)}
        ${dreRow('Custo das Mercadorias Vendidas (CMV)',R(cmv),true,false,'var(--muted)',false)}
        ${dreRow('Lucro Bruto',`${R(lucroBruto)} <span style="font-size:11px;color:var(--ok)">(${mgBruta.toFixed(1)}%)</span>`,false,true,lucroBruto>=0?'var(--ok)':'var(--err)',true)}
        <div style="margin:8px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)">Custos Fixos</div>
        ${fixos.map(c=>`${dreRow(c.name,R(c.value),true,false,'var(--muted)',false)}`).join('')}
        ${dreRow('Total Custos Fixos',R(totalFixo),false,false,'var(--err)',false)}
        ${variaveis.length?`<div style="margin:8px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)">Custos Variáveis</div>
        ${variaveis.map(c=>`${dreRow(c.name+(c.pct?` (${c.value}%)`:''),R(c.pct?receitaBruta*c.value/100:c.value),true,false,'var(--muted)',false)}`).join('')}
        ${dreRow('Total Custos Variáveis',R(totalVarValor),false,false,'var(--err)',false)}`:''}
        ${dreRow('Lucro / Prejuízo Líquido',`${R(lucroOp)} <span style="font-size:11px">(${mgLiq.toFixed(1)}%)</span>`,false,true,lucroOp>=0?'var(--ok)':'var(--err)',true)}
      </div>
    </div>

    <!-- Painel direito -->
    <div style="display:flex;flex-direction:column;gap:14px">
      <!-- Ponto de Equilíbrio -->
      <div class="card">
        <div class="card-hdr"><div class="card-title">⚖️ Ponto de Equilíbrio</div></div>
        <div class="card-body">
          <div style="text-align:center;margin-bottom:14px">
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)">Precisa faturar por mês</div>
            <div style="font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;color:var(--pri)">${R(peq)}</div>
            ${receitaBruta>0?`<div style="font-size:12px;color:${receitaBruta>=peq?'var(--ok)':'var(--err)'}">${receitaBruta>=peq?'✅ Meta atingida este mês!':'⚠️ Falta '+R(peq-receitaBruta)+' para o equilíbrio'}</div>`:'<div style="font-size:12px;color:var(--muted)">Sem vendas no mês</div>'}
          </div>
          <div style="background:var(--bg);border-radius:8px;padding:12px">
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px">
              <span style="color:var(--muted)">Progresso do mês</span>
              <span style="font-weight:600">${peqPct.toFixed(0)}%</span>
            </div>
            <div style="background:var(--bdr);border-radius:6px;height:10px;overflow:hidden">
              <div style="width:${peqPct}%;background:${peqPct>=100?'var(--ok)':'var(--pri)'};height:10px;border-radius:6px;transition:width .5s"></div>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:11px;margin-top:6px;color:var(--muted)">
              <span>${R(receitaBruta)} faturado</span>
              <span>Meta: ${R(peq)}</span>
            </div>
          </div>
          <div style="margin-top:12px;padding:10px;background:#fff8f0;border-radius:8px;border-left:3px solid var(--sec)">
            <div style="font-size:12px;color:var(--muted)">Dia do equilíbrio estimado</div>
            <div style="font-size:18px;font-weight:700;color:var(--sec)">Dia ${Math.min(diaEquilibrio,diasNoMes)} de ${diasNoMes}</div>
            <div style="font-size:11px;color:var(--muted)">baseado no ritmo atual de vendas</div>
          </div>
        </div>
      </div>

      <!-- Resumo rápido de custos -->
      <div class="card">
        <div class="card-hdr"><div class="card-title">💸 Total de Custos/Mês</div></div>
        <div class="card-body" style="padding:14px">
          <div style="display:flex;flex-direction:column;gap:8px">
            <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg);border-radius:8px">
              <span style="font-size:13px">Fixos</span>
              <strong style="color:var(--err)">${R(totalFixo)}</strong>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg);border-radius:8px">
              <span style="font-size:13px">Variáveis</span>
              <strong style="color:var(--warn)">${R(totalVarValor||totalVar)}</strong>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:linear-gradient(135deg,rgba(224,85,85,.08),rgba(224,85,85,.15));border-radius:8px;border:1.5px solid #fca5a5">
              <strong style="font-size:14px">Total Mensal</strong>
              <strong style="font-size:16px;color:var(--err)">${R(totalFixo+totalVarValor)}</strong>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Listagem de custos -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
    <!-- Fixos -->
    <div class="card">
      <div class="card-hdr">
        <div class="card-title">📌 Custos Fixos Recorrentes</div>
        <span class="badge b-err">${R(totalFixo)}/mês</span>
      </div>
      <div class="tw" id="tbl-fixo">${tblCustos(fixos,'fixo')}</div>
    </div>
    <!-- Variáveis -->
    <div class="card">
      <div class="card-hdr">
        <div class="card-title">📊 Custos Variáveis</div>
        <span class="badge b-warn">${R(totalVar)}/mês</span>
      </div>
      <div class="tw" id="tbl-var">${tblCustos(variaveis,'variavel')}</div>
      <div style="padding:10px 14px;border-top:1px solid var(--bdr)">
        <button class="btn btn-sec btn-sm" onclick="openCustoModal('variavel')">+ Custo Variável</button>
      </div>
    </div>
  </div>

  <!-- Inativos -->
  ${costs.filter(c=>!c.active).length?`<div class="card">
    <div class="card-hdr"><div class="card-title" style="color:var(--muted)">🚫 Custos Inativos</div></div>
    <div class="tw">${tblCustos(costs.filter(c=>!c.active),'_')}</div>
  </div>`:''}`;
}

function tblCustos(list,type){
  if(!list.length)return`<div class="empty" style="padding:20px"><p>${type==='fixo'?'Nenhum custo fixo':type==='variavel'?'Nenhum custo variável':'Nenhum'}</p></div>`;
  return`<table><thead><tr><th>Nome</th><th>Categoria</th><th>Valor</th><th>Período</th><th></th></tr></thead><tbody>
  ${list.map(c=>`<tr style="${!c.active?'opacity:.5':''}">
    <td><strong>${c.name}</strong>${c.note?`<br><small style="color:var(--muted)">${c.note}</small>`:''}
    ${c.type==='variavel'&&c.pct?`<span class="badge b-info" style="margin-left:4px">% da receita</span>`:''}
    </td>
    <td><span class="badge b-gray">${c.category}</span></td>
    <td><strong style="color:${c.active?'var(--err)':'var(--muted)'}">${c.pct?c.value+'%':R(c.value)}</strong></td>
    <td style="font-size:12px;color:var(--muted)">${c.period}</td>
    <td style="text-align:right;white-space:nowrap">
      <button class="btn-ic" onclick="toggleCusto('${c.id}')" title="${c.active?'Desativar':'Ativar'}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="${c.active?'M18.36 6.64a9 9 0 1 1-12.73 0':'M12 2a10 10 0 1 0 10 10'}"/>${c.active?'<line x1="12" y1="2" x2="12" y2="12"/>':''}</svg>
      </button>
      <button class="btn-ic" onclick="openCustoModal('',this,'${c.id}')" title="Editar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
      <button class="btn-ic" onclick="delCusto('${c.id}')" title="Excluir"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg></button>
    </td>
  </tr>`).join('')}</tbody></table>`;
}

function openCustoModal(tipo,_,editId){
  const c=editId?gCS().find(x=>x.id===editId):null;
  const t=c?c.type:(tipo==='variavel'?'variavel':'fixo');
  openModal(`<div class="modal"><div class="mhdr">
    <div class="mtitle">${c?'Editar':'Novo'} Custo ${t==='fixo'?'Fixo':'Variável'}</div>
    <button class="btn-ic" onclick="closeModal()">✕</button></div>
  <div class="mbody">
    <div class="fr fr2">
      <div class="fg"><label class="fl">Tipo</label>
        <select class="fc" id="ct-type" onchange="toggleVarFields()">
          <option value="fixo"${t==='fixo'?' selected':''}>Fixo/Recorrente</option>
          <option value="variavel"${t==='variavel'?' selected':''}>Variável</option>
        </select>
      </div>
      <div class="fg"><label class="fl">Categoria</label>
        <select class="fc" id="ct-cat">${COST_CATS.map(cat=>`<option${c&&c.category===cat?' selected':''}>${cat}</option>`).join('')}</select>
      </div>
    </div>
    <div class="fg"><label class="fl">Nome *</label><input class="fc" id="ct-name" value="${c?c.name:''}" placeholder="Ex: Aluguel, Embalagens..."></div>
    <div class="fr fr2">
      <div class="fg" id="ct-val-grp">
        <label class="fl" id="ct-val-lbl">${c&&c.pct?'Percentual (%)':'Valor (R$)'} *</label>
        <input class="fc" type="number" step="0.01" id="ct-val" value="${c?c.value:''}" placeholder="0,00">
      </div>
      <div class="fg" id="ct-pct-grp" style="${t==='variavel'?'':'display:none'}">
        <label class="fl">Cobrado como</label>
        <select class="fc" id="ct-pct" onchange="togglePctLabel()">
          <option value="0"${c&&!c.pct?' selected':''}>Valor fixo (R$)</option>
          <option value="1"${c&&c.pct?' selected':''}>% da receita bruta</option>
        </select>
      </div>
    </div>
    <div class="fr fr2">
      <div class="fg"><label class="fl">Período</label>
        <select class="fc" id="ct-period">
          ${['mensal','quinzenal','semanal','anual','único'].map(p=>`<option${c&&c.period===p?' selected':''}>${p}</option>`).join('')}
        </select>
      </div>
      <div class="fg"><label class="fl">Status</label>
        <select class="fc" id="ct-active">
          <option value="1"${!c||c.active?' selected':''}>Ativo</option>
          <option value="0"${c&&!c.active?' selected':''}>Inativo</option>
        </select>
      </div>
    </div>
    <div class="fg"><label class="fl">Observação</label><input class="fc" id="ct-note" value="${c?c.note:''}" placeholder="Opcional..."></div>
  </div>
  <div class="mftr">
    <button class="btn btn-sec" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-pri" onclick="saveCusto('${editId||''}')">Salvar</button>
  </div></div>`);
}
function toggleVarFields(){
  const t=document.getElementById('ct-type').value;
  document.getElementById('ct-pct-grp').style.display=t==='variavel'?'':'none';
}
function togglePctLabel(){
  const isPct=document.getElementById('ct-pct').value==='1';
  document.getElementById('ct-val-lbl').textContent=isPct?'Percentual (%) *':'Valor (R$) *';
}
function saveCusto(editId){
  const name=document.getElementById('ct-name').value.trim();
  const type=document.getElementById('ct-type').value;
  const category=document.getElementById('ct-cat').value;
  const value=parseFloat(document.getElementById('ct-val').value)||0;
  const pct=type==='variavel'&&document.getElementById('ct-pct').value==='1';
  const period=document.getElementById('ct-period').value;
  const active=document.getElementById('ct-active').value==='1';
  const note=document.getElementById('ct-note').value.trim();
  if(!name||value<=0){toast('Preencha nome e valor','err');return;}
  const cs=gCS();
  if(editId){const i=cs.findIndex(x=>x.id===editId);cs[i]={...cs[i],name,type,category,value,pct,period,active,note};}
  else cs.push({id:uid(),name,type,category,value,pct,period,active,note});
  sCS(cs);closeModal();toast('Custo salvo!');go('custos');
}
function toggleCusto(id){
  const cs=gCS();const i=cs.findIndex(x=>x.id===id);
  cs[i].active=!cs[i].active;sCS(cs);go('custos');
}
function delCusto(id){
  if(!confirm('Excluir este custo?'))return;
  sCS(gCS().filter(x=>x.id!==id));toast('Custo removido','warn');go('custos');
}

// PAYBACK & PROJEÇÃO
// ═══════════════════════════════════════════════════════════════
const LOAN={total:18050,p1:1715.87,p12:1575.02,n:12,start:'2026-06-01'};
const INV_CATS=['Estrutura','Móveis','Equipamento','Embalagem','Estoque','Marketing','Deslocamento','Infraestrutura','Outros'];

function paybackPage(){
  const inv=gInv();
  const totalInv=inv.reduce((s,i)=>s+i.value,0);
  const costs=gCS().filter(c=>c.active&&c.type==='fixo');
  const fixoMes=costs.reduce((s,c)=>s+c.value,0);
  const margem=0.531;

  // Calcular parcela atual do empréstimo
  const r=(LOAN.p1/LOAN.p12-1)/(LOAN.n-LOAN.p1/LOAN.p12);
  const amort=LOAN.p12/(1+r);
  const startDate=new Date(LOAN.start);
  const now=new Date();
  const mesDecorrido=Math.max(0,Math.floor((now-startDate)/(30.44*864e5)));
  const parcMes=Math.min(mesDecorrido,LOAN.n-1);
  const parcelaAtual=parcMes<LOAN.n?parseFloat((amort*(1+(LOAN.n-parcMes)*r)).toFixed(2)):0;
  const parcelasRestantes=Math.max(0,LOAN.n-mesDecorrido);
  const totalJaPago=Array.from({length:mesDecorrido},(_, k)=>amort*(1+(LOAN.n-k)*r)).reduce((s,v)=>s+v,0);

  // Vendas reais dos últimos 30 dias
  const ss=gS().filter(s=>!s.cancelled);
  const diasAtras30=new Date(Date.now()-30*864e5).toISOString();
  const ss30=ss.filter(s=>s.createdAt>=diasAtras30);
  const fatReal30=ss30.reduce((s,v)=>s+v.total,0);
  const fatMesRef=fatReal30;

  // CMV real
  const ps=gP();
  let cmv30=0;
  ss30.forEach(sale=>sale.items.forEach(it=>{const p=ps.find(x=>x.id===it.id);if(p)cmv30+=p.cost*it.qty;}));
  const lucBruto30=fatMesRef-cmv30;
  const lliq30=lucBruto30-fixoMes;
  const pb=lliq30>0?totalInv/lliq30:null;

  // Projeção por cenário
  const cenarios=[
    {label:'Pessimista',fat:3500,cor:'#e05555',icon:'😔'},
    {label:'Realista Mês 1-2',fat:4500,cor:'#f0a500',icon:'🟡'},
    {label:'Realista Mês 3-6',fat:6500,cor:'#6b9dd4',icon:'📈'},
    {label:'Meta mínima',fat:fixoMes/margem+1,cor:'#9e6878',icon:'⚖️'},
    {label:'Consolidado',fat:8000,cor:'#4caf7d',icon:'✅'},
    {label:'Excelente',fat:12000,cor:'#b5546a',icon:'🚀'},
  ].map(c=>({...c,lb:c.fat*margem,ll:c.fat*margem-fixoMes,pb:c.fat*margem-fixoMes>0?Math.ceil(totalInv/(c.fat*margem-fixoMes)):null}));

  // Análise realista do contexto
  const breakEven=fixoMes/margem;

  return`
  <div class="pg-hdr">
    <div><div class="pg-title">Payback & Projeção</div>
    <div class="pg-sub">Investimento total · retorno · previsões</div></div>
    <button class="btn btn-pri" onclick="openInvModal()">+ Novo Gasto</button>
  </div>

  <!-- KPIs topo -->
  <div class="stats-g" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat-c" style="border-left:4px solid var(--err)">
      <div class="stat-lbl">Total Investido</div>
      <div class="stat-val" style="color:var(--err);font-size:22px">${R(totalInv)}</div>
      <div style="font-size:11px;color:var(--muted)">${inv.length} itens registrados</div>
    </div>
    <div class="stat-c" style="border-left:4px solid var(--sec)">
      <div class="stat-lbl">Empréstimo</div>
      <div class="stat-val" style="color:var(--sec);font-size:22px">${R(LOAN.total)}</div>
      <div style="font-size:11px;color:var(--muted)">${parcelasRestantes} parcelas restantes</div>
    </div>
    <div class="stat-c" style="border-left:4px solid var(--pri)">
      <div class="stat-lbl">Break-even mensal</div>
      <div class="stat-val" style="color:var(--pri);font-size:22px">${R(breakEven)}</div>
      <div style="font-size:11px;color:var(--muted)">para cobrir custos fixos</div>
    </div>
    <div class="stat-c" style="border-left:4px solid ${lliq30>=0?'var(--ok)':'var(--err)'}">
      <div class="stat-lbl">Lucro Líq. (últimos 30d)</div>
      <div class="stat-val" style="color:${lliq30>=0?'var(--ok)':'var(--err)'};font-size:22px">${R(lliq30)}</div>
      <div style="font-size:11px;color:var(--muted)">fat: ${R(fatMesRef)} · ${ss30.length} vendas</div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start">

    <!-- Payback dinâmico baseado nas vendas reais -->
    <div class="card">
      <div class="card-hdr" style="background:linear-gradient(135deg,#3b0a1f,#6b1535)">
        <div class="card-title" style="color:#fff">⏱️ Payback Real — baseado nas suas vendas</div>
      </div>
      <div class="card-body">
        ${fatMesRef>0?`
        <div style="text-align:center;margin-bottom:18px">
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)">Com o ritmo atual de vendas</div>
          ${lliq30>0?`
          <div style="font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:700;color:var(--pri)">${pb?pb.toFixed(0):'∞'} <span style="font-size:20px">meses</span></div>
          <div style="font-size:13px;color:var(--ok);font-weight:600">= ${pb?Math.floor(pb/12)+'a '+pb%12+'m':''} para recuperar R$${R(totalInv)}</div>
          `:`<div style="font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--err)">Abaixo do break-even</div>
          <div style="font-size:12px;color:var(--muted)">Falta ${R(Math.abs(lliq30))}/mês para cobrir os custos fixos</div>`}
        </div>
        <div style="background:var(--bg);border-radius:8px;padding:12px;margin-bottom:12px">
          <div class="sr"><span style="font-size:12px">Faturamento (30d)</span><strong>${R(fatMesRef)}</strong></div>
          <div class="sr"><span style="font-size:12px">CMV (custo mercadoria)</span><span style="color:var(--err)">- ${R(cmv30)}</span></div>
          <div class="sr"><span style="font-size:12px">Lucro bruto</span><strong>${R(lucBruto30)}</strong></div>
          <div class="sr"><span style="font-size:12px">Custos fixos</span><span style="color:var(--err)">- ${R(fixoMes)}</span></div>
          <div class="sr" style="border-top:1.5px solid var(--bdr);padding-top:6px;margin-top:4px"><span style="font-weight:700">Lucro líquido</span><strong style="color:${lliq30>=0?'var(--ok)':'var(--err)'}">${R(lliq30)}</strong></div>
        </div>`:`
        <div style="text-align:center;padding:20px 0">
          <div style="font-size:40px;margin-bottom:8px">📊</div>
          <div style="font-size:14px;font-weight:600;color:var(--txt)">Sem vendas registradas ainda</div>
          <div style="font-size:12px;color:var(--muted);margin-top:6px">Registre vendas no PDV para calcular o payback real automaticamente</div>
        </div>`}

        <!-- Barra progresso empréstimo -->
        <div style="margin-top:14px;padding:12px;background:#fff8f0;border-radius:8px;border-left:3px solid var(--sec)">
          <div style="font-size:12px;font-weight:600;margin-bottom:8px;color:var(--sec)">Progresso do Empréstimo</div>
          <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px">
            <span>${mesDecorrido} de ${LOAN.n} parcelas pagas</span>
            <span>${R(totalJaPago)} pagos</span>
          </div>
          <div style="background:#e8d9df;border-radius:6px;height:8px">
            <div style="width:${Math.min(mesDecorrido/LOAN.n*100,100).toFixed(0)}%;background:var(--sec);height:8px;border-radius:6px"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:11px;margin-top:5px;color:var(--muted)">
            <span>Parcela atual: ${R(parcelaAtual)}</span>
            <span>Total: ${R(LOAN.total)}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Análise realista do contexto -->
    <div class="card">
      <div class="card-hdr"><div class="card-title">🔍 Análise Realista — Contexto</div></div>
      <div class="card-body" style="font-size:13px;display:flex;flex-direction:column;gap:10px">
        <div style="background:#fdf0f4;border-radius:8px;padding:12px;border-left:3px solid var(--pri)">
          <div style="font-weight:700;margin-bottom:4px">Mercado: Gurinhém, PB</div>
          <div style="color:var(--muted);font-size:12px;line-height:1.6">~14.000 habitantes · estimativa de 4.500 mulheres potenciais compradoras · cidade de interior sem concorrência direta identificada no segmento de preço único.</div>
        </div>
        <div style="background:#fff8f0;border-radius:8px;padding:12px;border-left:3px solid var(--sec)">
          <div style="font-weight:700;margin-bottom:4px">Vantagem competitiva real</div>
          <div style="color:var(--muted);font-size:12px;line-height:1.6">Preço único R$10/R$15 é raro no interior. Produtos nacionais conhecidos (Vivai, Ruby Rose, DAPOP). Loja física com identidade visual profissional.</div>
        </div>
        <div style="background:#fef9c3;border-radius:8px;padding:12px;border-left:3px solid var(--warn)">
          <div style="font-weight:700;margin-bottom:4px">⚠️ Sem dados de Instagram/Ads</div>
          <div style="color:#a16207;font-size:12px;line-height:1.6">Windsor.ai não localizou campanhas ativas. Se os R$300/mês de tráfego são feitos pelo impulsionamento direto do Instagram (botão "Impulsionar"), esses dados não ficam disponíveis via API — apenas campanhas criadas no Gerenciador de Anúncios do Meta são rastreáveis.</div>
        </div>
        <div style="background:#dcfce7;border-radius:8px;padding:12px;border-left:3px solid var(--ok)">
          <div style="font-weight:700;margin-bottom:4px">Projeção honesta</div>
          <div style="color:#16a34a;font-size:12px;line-height:1.6">Meses 1-2: R$3.000–4.500 (abertura + curiosidade). Meses 3-6: R$5.000–7.500 (fidelização). A partir do mês 7 com boa gestão de redes e boca a boca: R$8.000+.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Cenários de payback -->
  <div class="card">
    <div class="card-hdr"><div class="card-title">📊 Cenários de Payback — se vender X por mês</div>
    <div style="font-size:12px;color:var(--muted)">Total a recuperar: ${R(totalInv)} · Margem: 53,1% · Custos fixos: ${R(fixoMes)}/mês</div></div>
    <div style="padding:0">
      <table><thead><tr><th>Cenário</th><th>Faturamento</th><th>Lucro Bruto</th><th>Lucro Líquido</th><th>Payback</th><th>Viabilidade</th></tr></thead>
      <tbody>
      ${cenarios.map(c=>`<tr>
        <td>${c.icon} <strong>${c.label}</strong></td>
        <td>${R(c.fat)}</td>
        <td>${R(c.lb)}</td>
        <td style="color:${c.ll>0?'var(--ok)':'var(--err)'};font-weight:600">${R(c.ll)}</td>
        <td><strong style="color:${c.pb&&c.pb<=12?'var(--ok)':c.pb&&c.pb<=24?'var(--warn)':'var(--err)'}">${c.pb?c.pb+' meses':'❌ Prejuízo'}</strong></td>
        <td>${c.ll<0?'<span class="badge b-err">Inviável</span>':c.ll<500?'<span class="badge b-warn">Arriscado</span>':c.ll<1500?'<span class="badge b-info">Viável</span>':'<span class="badge b-ok">Ótimo</span>'}</td>
      </tr>`).join('')}
      </tbody></table>
    </div>
  </div>

  <!-- Investimentos cadastrados -->
  <div class="card">
    <div class="card-hdr">
      <div class="card-title">📋 Investimentos Cadastrados</div>
      <span class="badge b-err" style="font-size:13px">${R(totalInv)} total</span>
    </div>
    <div class="tw">
      <table><thead><tr><th>Descrição</th><th>Categoria</th><th>Data</th><th>Valor</th><th></th></tr></thead>
      <tbody id="inv-list">
      ${invTable(inv)}
      </tbody></table>
    </div>
    <div style="padding:14px;border-top:1px solid var(--bdr);display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-pri btn-sm" onclick="openInvModal()">+ Adicionar Gasto</button>
      <div style="font-size:12px;color:var(--muted)">Novos gastos são adicionados automaticamente ao cálculo de payback</div>
    </div>
  </div>`;
}

function invTable(inv){
  if(!inv.length)return`<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:20px">Nenhum investimento cadastrado</td></tr>`;
  const sorted=[...inv].sort((a,b)=>b.value-a.value);
  return sorted.map(i=>`<tr>
    <td><strong>${i.name}</strong></td>
    <td><span class="badge b-gray">${i.cat}</span></td>
    <td style="font-size:12px;color:var(--muted)">${i.date?new Date(i.date+'T12:00:00').toLocaleDateString('pt-BR'):'-'}</td>
    <td><strong style="color:var(--err)">${R(i.value)}</strong></td>
    <td style="text-align:right">
      <button class="btn-ic" onclick="delInv('${i.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg></button>
    </td>
  </tr>`).join('');
}

function openInvModal(){
  openModal(`<div class="modal"><div class="mhdr"><div class="mtitle">+ Novo Gasto / Investimento</div><button class="btn-ic" onclick="closeModal()">✕</button></div>
  <div class="mbody">
    <div class="fg"><label class="fl">Descrição *</label><input class="fc" id="inv-n" placeholder="Ex: Araras, etiquetas, taxa alvará..."></div>
    <div class="fr fr2">
      <div class="fg"><label class="fl">Categoria</label>
        <select class="fc" id="inv-c">${INV_CATS.map(c=>`<option>${c}</option>`).join('')}</select>
      </div>
      <div class="fg"><label class="fl">Valor (R$) *</label><input class="fc" type="number" step="0.01" id="inv-v" placeholder="0,00"></div>
    </div>
    <div class="fg"><label class="fl">Data do gasto</label><input class="fc" type="date" id="inv-d" value="${new Date().toISOString().slice(0,10)}"></div>
  </div>
  <div class="mftr"><button class="btn btn-sec" onclick="closeModal()">Cancelar</button>
  <button class="btn btn-pri" onclick="saveInv()">Salvar</button></div></div>`);
}
function saveInv(){
  const name=document.getElementById('inv-n').value.trim();
  const value=parseFloat(document.getElementById('inv-v').value)||0;
  const cat=document.getElementById('inv-c').value;
  const date=document.getElementById('inv-d').value;
  if(!name||!value){toast('Preencha nome e valor','err');return;}
  const inv=gInv();
  inv.push({id:uid(),name,cat,value,date});
  sInv(inv);closeModal();toast('Gasto adicionado!');go('payback');
}
function delInv(id){
  if(!confirm('Remover este investimento?'))return;
  sInv(gInv().filter(x=>x.id!==id));go('payback');
}
